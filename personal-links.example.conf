# ============================================================
# personal-links.example.conf — schema documentation
#
# Copy to personal-links.conf and edit for your environment:
#     cp personal-links.example.conf personal-links.conf
#
# personal-links.conf is gitignored: it names real local paths.
# Used by scripts/personal-links.sh.
# ============================================================

# LINK=<name>:<root>
#
# Repeatable. Each entry creates one symlink named <name> inside every
# registered project, pointing at <root>/<project folder name>.
#
# <root> is the central tree you back up or version control. Everything under
# it stays out of every project's git history.
#
# <name> must be a bare name, not a path. Pick something that cannot collide
# with real project content — avoid generic names like `docs`, which already
# exist in real projects and carry a meaning readers expect.
#
# A leading dot keeps it out of `ls`, and most tooling skips dot-directories by
# default (pytest's norecursedirs includes .*, ripgrep skips hidden paths), so
# the contents cannot break test collection or pollute a codebase search.

LINK=.brost:~/personal_files
LINK=.claude:~/claude_files

# Each name also needs a global git exclude, anchored with a leading slash and
# NO trailing slash — a trailing slash restricts the pattern to directories and
# git classifies a symlink as a file, so it silently fails to match:
#
#     git config --global core.excludesFile ~/.gitignore_global
#     printf '/.brost\n/.claude\n' >> ~/.gitignore_global
#
# The script reports any that are missing.

# EXCLUDE=<folder name or full path>
#
# Projects to skip, one per line. Match either the folder name or the full
# path exactly as it appears in projects.md. Repeat the key as needed.
#
# Worth excluding: workspaces that are not code and have nowhere sensible to
# put a link, and anything whose directory is shared or synced elsewhere.
#
# Excluding is not optional for a project whose directory is COPIED WHOLESALE
# by other tooling — a build that rsyncs the tree and then walks everything it
# finds will choke on a link it cannot resolve, and the failure surfaces at the
# consumer rather than here. See docs/personal-folders.md.
#
# EXCLUDE=hardware_upgrade_plan
# EXCLUDE=home_assistant

# EXTRA=<path>
#
# Repeatable. An additional directory to link that is NOT a registered project:
# workspace roots, this orchestrator repo itself — anywhere you actually sit and
# work, but which has no entry in projects.md. Without it those directories
# accumulate real .brost/.claude folders that nothing manages or backs up.
#
# Unlike EXCLUDE, the value is a path, not a folder name. A leading ~ is
# expanded. The link is named after the directory's own basename, exactly as it
# is for a project — EXTRA=~/Brost gets ~/Brost/.brost -> <root>/Brost.
#
# EXTRA paths go through the same checks as registered projects: they can be
# excluded, they are reported as `absent` (not an error) when the directory does
# not exist on this machine, and a basename that collides with a registered
# project's is reported as a collision rather than silently sharing content.
#
# EXTRA=~/Brost
